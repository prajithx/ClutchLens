<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ product_name }}{% endblock %} · Rajasthan Royals Strategy</title>
  <meta name="description" content="ClutchLens cricket intelligence foundation. See beyond statistics.">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="{{ url_for('index') }}"><span>CLUTCH</span><b>LENS</b></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">Menu</button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
      <a href="{{ url_for('analytics') }}">Analytics</a>
      <a href="{{ url_for('players') }}">Players</a>
      <a href="{{ url_for('ground') }}">Ground view</a>
      <a href="{{ url_for('recruitment') }}">Recruitment intelligence</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>CLUTCHLENS</span><span>Data foundation · metrics under review where noted</span></footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
</body>
</html>
