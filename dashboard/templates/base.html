<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ product_name }}{% endblock %} · Rajasthan Royals Strategy</title>
  <meta name="description" content="ClutchLens cricket intelligence foundation. See beyond statistics.">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="app-shell app-shell-{{ request.endpoint|replace('_', '-') }}">
  <header class="site-header">
    <a class="wordmark" href="{{ url_for('index') }}" aria-label="ClutchLens home"><span>CLUTCH</span><b>LENS</b></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle primary navigation">Menu</button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
      <a class="{% if request.endpoint == 'analytics' %}active{% endif %}" href="{{ url_for('analytics') }}" {% if request.endpoint == 'analytics' %}aria-current="page"{% endif %}>Analytics</a>
      <a class="{% if request.endpoint == 'players' %}active{% endif %}" href="{{ url_for('players') }}" {% if request.endpoint == 'players' %}aria-current="page"{% endif %}>Players</a>
      <a class="{% if request.endpoint == 'ground' %}active{% endif %}" href="{{ url_for('ground') }}" {% if request.endpoint == 'ground' %}aria-current="page"{% endif %}>Ground view</a>
      <a class="{% if request.endpoint == 'recruitment' %}active{% endif %}" href="{{ url_for('recruitment') }}" {% if request.endpoint == 'recruitment' %}aria-current="page"{% endif %}>Recruitment intelligence</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>CLUTCHLENS</span><span>Data foundation · metrics under review where noted</span></footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
</body>
</html>
